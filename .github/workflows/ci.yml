name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.0

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taply_test
          POSTGRES_USER: taply_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taply_user -d taply_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter @taply/api lint || echo "Lint warnings - continuing"

      - name: Lint Web
        run: pnpm --filter @taply/web lint || echo "Lint warnings - continuing"

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Build API
        run: pnpm --filter @taply/api build

      - name: Build Web
        run: pnpm --filter @taply/web build

      - name: Setup test database
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_PASSWORD=change_me/POSTGRES_PASSWORD=test_password/' .env
          sed -i 's|DATABASE_URL=.*|DATABASE_URL=postgresql://taply_user:test_password@localhost:5432/taply_test?schema=public|' .env
          pnpm --filter @taply/api prisma migrate reset --force
          pnpm --filter @taply/api prisma db seed
        env:
          DATABASE_URL: postgresql://taply_user:test_password@localhost:5432/taply_test?schema=public

      - name: Run API tests
        run: pnpm --filter @taply/api test
        env:
          DATABASE_URL: postgresql://taply_user:test_password@localhost:5432/taply_test?schema=public
          JWT_SECRET: test-jwt-secret
          REFRESH_SECRET: test-refresh-secret

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: taply-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: taply-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
