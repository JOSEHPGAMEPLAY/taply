name: Release & Deploy

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.0
  REGISTRY: ghcr.io
  API_IMAGE_NAME: taply-api
  WEB_IMAGE_NAME: taply-web

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Taply ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
