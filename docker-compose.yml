services:
  postgres:
    image: postgres:16-alpine
    container_name: taply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taply}
      POSTGRES_USER: ${POSTGRES_USER:-taply_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5433:5432"
    volumes:
      - taply_postgres_data:/var/lib/postgresql/data
    networks:
      - taply-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taply_user} -d ${POSTGRES_DB:-taply}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: taply-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:-taply-dev-jwt-secret-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      REFRESH_SECRET: ${REFRESH_SECRET:-taply-dev-refresh-secret-change-in-production}
      REFRESH_EXPIRATION: ${REFRESH_EXPIRATION:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taply-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Build-time defaults (can be overridden at runtime via environment)
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        API_INTERNAL_URL: http://api:3001/api/v1
    container_name: taply-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Server-side: used by Next.js Server Components inside Docker (resolves to "api" service)
      API_INTERNAL_URL: http://api:3001/api/v1
      # Client-side: exposed to browser via NEXT_PUBLIC_ prefix (resolves to host localhost)
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - taply-network

volumes:
  taply_postgres_data:
    driver: local

networks:
  taply-network:
    driver: bridge
